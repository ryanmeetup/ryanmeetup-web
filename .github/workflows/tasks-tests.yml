name: Tasks tests

on:
  pull_request:
    paths:
      - "apps/tasks/**"
      - "packages/**"
      - "package-lock.json"
      - ".github/workflows/tasks-tests.yml"
  push:
    branches: [main]

concurrency:
  group: tasks-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/tasks
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        working-directory: .
      - name: Lint tasks workspace
        run: npm run lint
      - name: Type-check tasks workspace
        run: npm run typecheck
      - name: Test tasks workspace with coverage
        run: npm run test:coverage
      - name: Upload Tasks coverage report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tasks-coverage
          path: coverage/tasks
          if-no-files-found: error
          retention-days: 14
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - name: Test RY-D workflows against isolated transports
        run: npm run test:e2e:ryd
