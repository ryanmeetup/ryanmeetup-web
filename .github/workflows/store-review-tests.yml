name: Store buyer review tests

on:
  pull_request:
    paths:
      - "apps/store/**"
      - "apps/tasks/supabase/**"
      - "apps/tasks/scripts/**"
      - "apps/tasks/tests/database/**"
      - "packages/**"
      - "package-lock.json"
      - ".github/workflows/store-review-tests.yml"
  push:
    branches: [main]

concurrency:
  group: store-review-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  database-profiles:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        target: [rmt, prd]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - uses: supabase/setup-cli@v1
        with:
          version: 2.115.0
      - name: Test isolated migration profile
        run: node scripts/test-store-customer-auth.mjs --target ${{ matrix.target }}
        working-directory: apps/tasks

  buyer-reviews:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/store
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
        working-directory: .
      - run: npx playwright install --with-deps chromium
      - name: Test buyer HTTP and backend contracts
        run: npx playwright test tests/my-review-actions.spec.ts tests/custom-review-submission.spec.ts tests/review-backend.spec.ts tests/review-diagnostics.spec.ts --workers=1
      - name: Test buyer review management against isolated transports
        run: npm run test:e2e:my-reviews
      - name: Test public review projections and structured data
        run: STORE_BASE_URL=http://127.0.0.1:39999 npx playwright test tests/product-schema.spec.ts tests/custom-review-replies.spec.ts tests/public-review-page.spec.ts tests/review-verification.spec.ts --workers=1 --output=test-results-public-reviews/unit
      - name: Test review photo processing, collection and private staging
        run: STORE_BASE_URL=http://127.0.0.1:39999 npx playwright test tests/review-photo-processing.spec.ts tests/review-photo-staging.spec.ts tests/review-photo-actions.spec.ts --workers=1 --output=test-results-public-reviews/photo-unit
      - name: Test public reviews against isolated reads
        run: npx playwright test --config=playwright.product-reviews.config.ts
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: store-buyer-review-results
          path: |
            apps/store/test-results
            apps/store/test-results-public-reviews
          retention-days: 7
